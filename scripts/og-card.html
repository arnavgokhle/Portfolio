<!doctype html>
<!-- Source for public/og.png. Render at exactly 1200x630 (device scale factor 1)
     in headless Chrome and screenshot; wait for document.fonts.ready first. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; background: #fff; }
      body {
        font-family: 'Inter', sans-serif;
        color: #000;
        padding: 88px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        -webkit-font-smoothing: antialiased;
      }
      .mark { width: 56px; height: 56px; display: block; }
      h1 { font-size: 112px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; }
      p { margin-top: 32px; max-width: 900px; font-size: 38px; font-weight: 300; letter-spacing: -0.015em; line-height: 1.3; }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <g transform="rotate(-35 12 12)">
        <rect x="4" y="8" width="16" height="3.4" rx="1.7" fill="#000" />
        <rect x="4" y="13" width="16" height="3.4" rx="1.7" fill="#000" />
      </g>
    </svg>
    <div>
      <h1>Arnav Gokhle</h1>
      <p>Business Analytics &amp; AI @ UT Dallas —<br />I build software people use.</p>
    </div>
  </body>
</html>
